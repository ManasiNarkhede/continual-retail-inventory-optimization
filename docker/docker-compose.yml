version: '3.9'

services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    working_dir: /mlflow
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000', timeout=2)\""]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles: ["default", "prod"]
    volumes:
      - ./mlruns:/mlflow/mlruns

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      ENV: "production"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      API_PRELOAD_MODELS: "1"
      PRODUCTION_GUARD_ALLOW_QUIET_TRAIN: "1"
    volumes:
      - ./:/app
      - ./outputs:/app/outputs
      - ./reports/figures:/app/reports/figures
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, json; data=json.loads(urllib.request.urlopen('http://localhost:8000/health', timeout=2).read().decode()); assert data.get('status')=='ok' and data.get('registry') in ('ok',)\""]
      interval: 20s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: ["default", "prod"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "5173:80"
    profiles: ["default"]
